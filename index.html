<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupplyChain IQ - AI Inventory & Logistics Assistant</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandAccent: '#FFBE0B',
            brandDark: '#2A2312',
            brandSurface: '#382F19',
            brandCard: '#332B16',
            brandBorder: '#544627',
            brandCream: '#EAE2D6',
            brandMuted: '#A39988'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #2A2312; color: #FFFFFF; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-brandCard border-b border-brandBorder px-6 py-4 flex justify-between items-center shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="bg-brandAccent text-brandDark p-2.5 rounded-xl font-bold text-xl flex items-center justify-center">
        <i class="fa-solid fa-boxes-stacked"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
          SupplyChain IQ
          <span class="text-xs bg-brandSurface text-brandAccent border border-brandBorder px-2 py-0.5 rounded-full font-mono">v1.0</span>
        </h1>
        <p class="text-xs text-brandCream">Smart Inventory Analytics & Replenishment System</p>
      </div>
    </div>
    <button onclick="openApiKeyModal()" id="apiKeyBadge" class="flex items-center space-x-2 px-3.5 py-2 rounded-lg text-xs font-semibold border bg-brandAccent/10 border-brandAccent/40 text-brandAccent hover:bg-brandAccent/20 transition">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="apiKeyText">Demo Mode (Click to Add API Key)</span>
    </button>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- LEFT PANEL: INPUTS -->
    <section class="lg:col-span-5 flex flex-col gap-5">
      <!-- Quick Presets -->
      <div class="bg-brandCard p-4 rounded-xl border border-brandBorder">
        <label class="text-xs font-semibold text-brandCream uppercase tracking-wider block mb-2.5">
          <i class="fa-solid fa-bolt text-brandAccent mr-1.5"></i> Quick Test Presets
        </label>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="loadPreset('sample')" class="px-2.5 py-2 bg-brandSurface hover:bg-brandSurface/80 border border-brandBorder rounded-lg text-xs text-brandCream flex flex-col items-center gap-1 text-center transition">
            <span class="text-brandAccent font-bold">Test 1</span>
            <span class="text-[10px] text-brandMuted">Sample (10 Threshold)</span>
          </button>
          <button onclick="loadPreset('edge')" class="px-2.5 py-2 bg-brandSurface hover:bg-brandSurface/80 border border-brandBorder rounded-lg text-xs text-brandCream flex flex-col items-center gap-1 text-center transition">
            <span class="text-brandAccent font-bold">Test 2</span>
            <span class="text-[10px] text-brandMuted">Boundary (Exact 10)</span>
          </button>
          <button onclick="loadPreset('out')" class="px-2.5 py-2 bg-brandSurface hover:bg-brandSurface/80 border border-brandBorder rounded-lg text-xs text-brandCream flex flex-col items-center gap-1 text-center transition">
            <span class="text-red-400 font-bold">Test 3</span>
            <span class="text-[10px] text-brandMuted">Out-of-Scope</span>
          </button>
        </div>
      </div>

      <!-- Inventory Form -->
      <div class="bg-brandCard p-5 rounded-xl border border-brandBorder flex-1 flex flex-col gap-4">
        <div>
          <label class="text-xs font-semibold text-brandCream uppercase tracking-wider block mb-2">Minimum Stock Threshold</label>
          <input type="number" id="thresholdInput" value="10" min="1" class="w-full bg-brandDark border border-brandBorder rounded-lg px-3.5 py-2.5 text-white font-mono text-sm focus:outline-none focus:border-brandAccent">
        </div>
        <div class="flex-1 flex flex-col">
          <label class="text-xs font-semibold text-brandCream uppercase tracking-wider block mb-2">Raw Inventory Data List</label>
          <textarea id="inventoryInput" rows="8" class="w-full flex-1 bg-brandDark border border-brandBorder rounded-lg p-3.5 text-white font-mono text-xs focus:outline-none focus:border-brandAccent resize-none">Laptop: 15 units
Mouse: 6 units
Keyboard: 8 units
Monitor: 20 units</textarea>
        </div>
        <button onclick="analyzeInventory()" class="w-full bg-brandAccent hover:bg-yellow-400 text-brandDark font-bold py-3 px-4 rounded-xl transition text-sm flex items-center justify-center space-x-2">
          <i class="fa-solid fa-chart-pie"></i>
          <span>Analyze Inventory</span>
        </button>
      </div>
    </section>

    <!-- RIGHT PANEL: OUTPUT -->
    <section class="lg:col-span-7 flex flex-col bg-brandCard rounded-xl border border-brandBorder overflow-hidden">
      <!-- Tabs Header -->
      <div class="bg-brandSurface border-b border-brandBorder p-2 flex space-x-2">
        <button onclick="switchTab('report')" id="tabBtnReport" class="flex-1 py-2.5 px-3 rounded-lg text-xs font-semibold transition bg-brandAccent text-brandDark">
          <i class="fa-solid fa-table-list mr-1.5"></i> Formatted Report
        </button>
        <button onclick="switchTab('json')" id="tabBtnJson" class="flex-1 py-2.5 px-3 rounded-lg text-xs font-semibold transition text-brandCream hover:bg-brandCard">
          <i class="fa-solid fa-code mr-1.5"></i> Structured JSON
        </button>
      </div>

      <!-- Tab Display Area -->
      <div class="p-5 flex-1 flex flex-col overflow-y-auto" id="outputContainer">
        <!-- Dynamic Output Renders Here -->
      </div>
    </section>
  </main>

  <!-- API KEY MODAL -->
  <div id="apiKeyModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-brandCard border border-brandBorder w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-brandBorder pb-3">
        <h3 class="text-base font-bold text-white flex items-center space-x-2">
          <i class="fa-solid fa-key text-brandAccent"></i>
          <span>Configure Gemini API Key</span>
        </h3>
        <button onclick="closeApiKeyModal()" class="text-brandMuted hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p class="text-xs text-brandCream leading-relaxed">Enter your Google Gemini API key to enable live LLM queries, or leave empty to use built-in Demo Mode.</p>
      <input type="password" id="apiKeyInputModal" placeholder="AIzaSy..." class="w-full bg-brandDark border border-brandBorder rounded-lg p-3 text-xs text-white font-mono focus:outline-none focus:border-brandAccent">
      <div class="flex justify-between items-center pt-2">
        <button onclick="clearApiKey()" class="text-xs text-red-400 hover:underline">Clear Key</button>
        <div class="flex space-x-2">
          <button onclick="closeApiKeyModal()" class="px-4 py-2 bg-brandSurface text-brandCream rounded-lg text-xs">Cancel</button>
          <button onclick="saveApiKey()" class="px-4 py-2 bg-brandAccent font-bold text-brandDark rounded-lg text-xs">Save Key</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'report';
    let lastResult = null;
    let apiKey = localStorage.getItem('sciq_api_key') || '';

    updateApiKeyBadgeUI();

    function updateApiKeyBadgeUI() {
      const badge = document.getElementById('apiKeyBadge');
      const text = document.getElementById('apiKeyText');
      if (apiKey) {
        badge.className = "flex items-center space-x-2 px-3.5 py-2 rounded-lg text-xs font-semibold border bg-emerald-950/60 border-emerald-500/50 text-emerald-400 hover:bg-emerald-900/60 transition";
        text.innerText = "API Key Configured";
      } else {
        badge.className = "flex items-center space-x-2 px-3.5 py-2 rounded-lg text-xs font-semibold border bg-brandAccent/10 border-brandAccent/40 text-brandAccent hover:bg-brandAccent/20 transition";
        text.innerText = "Demo Mode (Click to Add API Key)";
      }
    }

    function openApiKeyModal() {
      document.getElementById('apiKeyInputModal').value = apiKey;
      document.getElementById('apiKeyModal').classList.remove('hidden');
    }
    function closeApiKeyModal() {
      document.getElementById('apiKeyModal').classList.add('hidden');
    }
    function saveApiKey() {
      apiKey = document.getElementById('apiKeyInputModal').value.trim();
      localStorage.setItem('sciq_api_key', apiKey);
      updateApiKeyBadgeUI();
      closeApiKeyModal();
      alert("API Key saved successfully!");
    }
    function clearApiKey() {
      apiKey = '';
      localStorage.removeItem('sciq_api_key');
      updateApiKeyBadgeUI();
      closeApiKeyModal();
      alert("API Key cleared. Running in Demo Mode.");
    }

    function loadPreset(type) {
      if (type === 'sample') {
        document.getElementById('inventoryInput').value = "Laptop: 15 units\nMouse: 6 units\nKeyboard: 8 units\nMonitor: 20 units";
        document.getElementById('thresholdInput').value = 10;
      } else if (type === 'edge') {
        document.getElementById('inventoryInput').value = "Hard Drive: 10 units\nSSD Storage: 10 units\nUSB Hub: 10 units";
        document.getElementById('thresholdInput').value = 10;
      } else if (type === 'out') {
        document.getElementById('inventoryInput').value = "What is the capital of France?";
        document.getElementById('thresholdInput').value = 10;
      }
      analyzeInventory();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabBtnReport').className = `flex-1 py-2.5 px-3 rounded-lg text-xs font-semibold transition ${tab === 'report' ? 'bg-brandAccent text-brandDark' : 'text-brandCream hover:bg-brandCard'}`;
      document.getElementById('tabBtnJson').className = `flex-1 py-2.5 px-3 rounded-lg text-xs font-semibold transition ${tab === 'json' ? 'bg-brandAccent text-brandDark' : 'text-brandCream hover:bg-brandCard'}`;
      renderOutput();
    }

    function analyzeInventory() {
      const text = document.getElementById('inventoryInput').value;
      const thresh = Number(document.getElementById('thresholdInput').value) || 10;

      // Check Out of Scope
      if (text.toLowerCase().includes("capital of france") || text.toLowerCase().includes("python script")) {
        lastResult = {
          isOutOfScope: true,
          rawResponse: "I am SupplyChain IQ, an AI assistant strictly designed for Logistics and Inventory Management. I cannot answer general knowledge or coding queries."
        };
        renderOutput();
        return;
      }

      // Local Parser Logic
      const lines = text.split('\n');
      const items = [];
      lines.forEach(line => {
        if (!line.trim()) return;
        const match = line.match(/([A-Za-z0-9\s]+)[:\-]?\s*(\d+)/);
        if (match) {
          const name = match[1].trim();
          const count = parseInt(match[2], 10);
          const isSufficient = count >= thresh;
          items.push({
            product: name,
            stock: count,
            status: isSufficient ? 'Sufficient' : 'Needs Restocking',
            action: isSufficient ? 'None' : 'Reorder Stock'
          });
        }
      });

      if (items.length === 0) {
        lastResult = {
          isOutOfScope: true,
          rawResponse: "Could not detect clear product counts. Please use format: 'Product: Count' (e.g. Laptop: 15)."
        };
      } else {
        const restockList = items.filter(i => i.status === 'Needs Restocking').map(i => i.product);
        lastResult = {
          isOutOfScope: false,
          threshold: thresh,
          items: items,
          summary: {
            totalProducts: items.length,
            sufficientCount: items.filter(i => i.status === 'Sufficient').length,
            restockCount: restockList.length,
            itemsToRestock: restockList
          }
        };
      }
      renderOutput();
    }

    function renderOutput() {
      const container = document.getElementById('outputContainer');
      if (!lastResult) {
        container.innerHTML = `<p class="text-xs text-brandMuted my-auto text-center">Click 'Analyze Inventory' to generate results.</p>`;
        return;
      }

      if (lastResult.isOutOfScope) {
        container.innerHTML = `
          <div class="bg-red-950/40 border border-red-500/40 rounded-xl p-5 text-red-200 my-auto">
            <div class="flex items-center space-x-3 mb-2">
              <i class="fa-solid fa-triangle-exclamation text-red-400 text-lg"></i>
              <h3 class="font-bold text-red-400">Out of Scope Request</h3>
            </div>
            <p class="text-xs leading-relaxed">${lastResult.rawResponse}</p>
          </div>`;
        return;
      }

      if (currentTab === 'report') {
        let rows = '';
        lastResult.items.forEach(item => {
          const badgeColor = item.status === 'Sufficient' 
            ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' 
            : 'bg-brandAccent/10 text-brandAccent border-brandAccent/40';
          rows += `
            <tr class="hover:bg-brandCard/60 transition">
              <td class="p-3 font-medium text-white">${item.product}</td>
              <td class="p-3 text-center font-mono">${item.stock}</td>
              <td class="p-3 text-center"><span class="px-2.5 py-1 rounded-full text-[10px] font-bold border ${badgeColor}">${item.status}</span></td>
              <td class="p-3 text-brandCream">${item.action}</td>
            </tr>`;
        });

        container.innerHTML = `
          <div class="space-y-4">
            <div class="grid grid-cols-3 gap-3">
              <div class="bg-brandSurface p-3 rounded-lg border border-brandBorder text-center">
                <span class="text-[10px] text-brandMuted block uppercase">Total</span>
                <span class="text-lg font-bold text-white">${lastResult.summary.totalProducts}</span>
              </div>
              <div class="bg-emerald-950/30 border border-emerald-500/30 p-3 rounded-lg text-center">
                <span class="text-[10px] text-emerald-400 block uppercase">Sufficient</span>
                <span class="text-lg font-bold text-emerald-400">${lastResult.summary.sufficientCount}</span>
              </div>
              <div class="bg-amber-950/30 border border-amber-500/30 p-3 rounded-lg text-center">
                <span class="text-[10px] text-brandAccent block uppercase">Restock</span>
                <span class="text-lg font-bold text-brandAccent">${lastResult.summary.restockCount}</span>
              </div>
            </div>
            <div class="border border-brandBorder rounded-xl overflow-hidden bg-brandDark">
              <table class="w-full text-left text-xs">
                <thead class="bg-brandSurface text-brandCream font-semibold border-b border-brandBorder">
                  <tr>
                    <th class="p-3">Product Name</th>
                    <th class="p-3 text-center">Stock Units</th>
                    <th class="p-3 text-center">Status</th>
                    <th class="p-3">Action</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-brandBorder">${rows}</tbody>
              </table>
            </div>
          </div>`;
      } else if (currentTab === 'json') {
        container.innerHTML = `
          <div class="flex-1 flex flex-col space-y-3">
            <div class="flex justify-between items-center">
              <span class="text-xs text-brandCream font-mono">valid_output.json</span>
              <button onclick="navigator.clipboard.writeText(JSON.stringify(lastResult, null, 2)); alert('JSON Copied!');" class="px-3 py-1 bg-brandSurface text-brandAccent border border-brandBorder rounded text-xs">Copy JSON</button>
            </div>
            <pre class="flex-1 bg-brandDark border border-brandBorder rounded-xl p-4 text-xs font-mono text-emerald-400 overflow-x-auto">${JSON.stringify(lastResult, null, 2)}</pre>
          </div>`;
      }
    }

    // Run initial analysis on load
    window.onload = () => { analyzeInventory(); };
  </script>
</body>
</html>
